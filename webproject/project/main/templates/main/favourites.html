{% extends "main/layout.html" %}

{% block title %}Избранное{% endblock %}

{% block content %}
<div class="container">
    <!-- SIDEBAR с фильтрами -->
    <aside class="sidebar">
        <h2 class="filters">Фильтры</h2>
        <div class="filter-group">
            <div class="filter-block">
                <span class="filter-title">Назначение</span>
                <label><input type="radio" name="purpose"> Рабочие приложения</label>
                <label><input type="radio" name="purpose"> Развлечение</label>
                <label><input type="radio" name="purpose"> Медиа</label>
                <label><input type="radio" name="purpose"> Утилиты</label>
                <label><input type="radio" name="purpose"> Образование</label>
            </div>

            <div class="filter-block">
                <span class="filter-title">Цена</span>
                <label><input type="radio" name="price"> Бесплатные</label>
                <label><input type="radio" name="price"> Платные</label>
            </div>

            <div class="filter-block">
                <span class="filter-title">Устройство</span>
                <label><input type="radio" name="device"> Windows</label>
                <label><input type="radio" name="device"> macOS</label>
            </div>

            <div class="filter-block">
                <span class="filter-title">Доступ</span>
                <label><input type="radio" name="access"> Desktop</label>
                <label><input type="radio" name="access"> Web</label>
                <label><input type="radio" name="access"> Mobile</label>
            </div>
        </div>

        <a href="{% url 'main' %}" class="abort">
            ← Назад на главную
        </a>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">
        <h1>Мои избранные приложения</h1>
        <div id="output"></div>
        <button class="btn-clear" onclick="return clearDictionaryWithConfirm()">Очистить избранное</button>
    </main>

    <!-- RECOMMENDATIONS -->
    <aside class="recommendations">
        <h2>Рекомендуемые</h2>
        <div class="rec-item">
            <a class="rec-text" href="https://max.ru" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/75/Max-logo-2025.png" alt="MAX" class="rec-icon">
                MAX
            </a>
        </div>
        <div class="rec-item">
            <a class="rec-text" href="https://dzen.ru" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/58/Yandex_icon.svg" alt="Дзен" class="rec-icon">
                Яндекс Дзен
            </a>
        </div>
        <div class="rec-item">
            <a class="rec-text" href="https://elma365.com/ru" target="_blank" rel="noopener noreferrer">
                <img src="https://softline.ru/upload/iblock/276/qldcbie6vmyo7mtnsqr74j95rpxl97nnelmacolor1024.png" alt="ELMA" class="rec-icon">
                ELMA 365
            </a>
        </div>
        <div class="rec-item">
            <a class="rec-text" href="https://1c.ru" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/93/1CCompanylogo.svg" alt="1C" class="rec-icon">
                1C:Предприятие
            </a>
        </div>
        <div class="rec-item">
            <a class="rec-text" href="https://www.kaspersky.ru" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/25/Kaspersky_logo.svg" alt="Kaspersky" class="rec-icon">
                Kaspersky
            </a>
        </div>
        <div class="rec-item">
            <a class="rec-text" href="https://rosa.ru/r7-office" target="_blank" rel="noopener noreferrer">
                <img src="https://www.irisoft.ru/wp-content/uploads/2022/09/r7o.png" alt="R7-Office" class="rec-icon">
                R7-Office
            </a>
        </div>
    </aside>
</div>

<script>
    const storageKey = 'favoritesDictionary';

    document.addEventListener('DOMContentLoaded', function() {
        const savedData = localStorage.getItem(storageKey);
        const output = document.getElementById('output');
        let html = '';

        if (savedData) {
            try {
                const favoritesDictionary = JSON.parse(savedData);
                const keys = Object.keys(favoritesDictionary);

                if (keys.length === 0) {
                    html = '<div class="alert alert-warning">Избранное пусто. Добавьте приложения на главной странице!</div>';
                } else {
                    keys.forEach(item => {
                        html += `<div class="output"><h3>${item}</h3></div>`;
                    });
                }

                console.log('Загруженное избранное:', favoritesDictionary);
            } catch (e) {
                console.error('Ошибка при разборе избранного:', e);
                html = '<div class="alert alert-warning">Ошибка при загрузке избранного</div>';
            }
        } else {
            html = '<div class="alert alert-warning">Избранное пусто. Добавьте приложения на главной странице!</div>';
        }

        output.innerHTML = html;
    });

    function clearDictionaryWithConfirm() {
        if (confirm('Вы уверены, что хотите очистить избранное? Это действие невозможно отменить.')) {
            clearDictionary();
            return true;
        }
        return false;
    }

    function clearDictionary() {
        const savedData = localStorage.getItem(storageKey);
        if (savedData) {
            try {
                const favoritesDictionary = JSON.parse(savedData);
                Object.keys(favoritesDictionary).forEach(key => {
                    delete favoritesDictionary[key];
                });
                localStorage.removeItem(storageKey);
                console.log('Избранное успешно очищено');
                location.reload();
            } catch (e) {
                console.error('Ошибка при очистке избранного:', e);
            }
        }
    }
</script>
{% endblock %}
