{% extends "main/layout.html" %}

{% block title %}Вход в аккаунт{% endblock %}

{% block content %}
<div class="auth-container">
    <form method="POST" class="auth-form">
        {% csrf_token %}

        <h1 class="auth-title">Создать аккаунт</h1>

        {% for field in form %}
        <div class="auth-field">
            <label for="{{ field.id_for_label }}" class="auth-label">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger">
                {{ field.errors }}
            </div>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="auth-btn">Регистрация</button>

        <div class="links-section">
            <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
        </div>
    </form>
</div>

{% endblock %}
